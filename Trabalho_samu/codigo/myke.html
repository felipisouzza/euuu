<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storm</title>
    <link rel="stylesheet" href="Access/CSS/style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <!--Header-->
    <header>
        <!-- Nav -->
        <div class="nav container">
            <a href="Sobre.html" class="logo">Storm</a>
            <!-- Cart Icon-->
            <i class='bx bx-shopping-bag' id="cart-icon"></i>
            <!-- Cart -->
            <div class="cart">
                <h2 class="cart-title">Seu cart</h2>
                <!--Content-->
                <div class="cart-content">

                </div>
                <!-- Total -->
                <div class="total">
                    <div class="total-title">Total</div>
                    <div class="total-price">$0,00</div>
                </div>
                <!-- Buy Button-->
                <button type="button" class="btn-buy">Buy Now</button>
                <!-- Cart Close-->
                <i class='bx bx-x' id="close-cart"></i>
            </div>
        </div>
    </header>
    <!-- Shop -->
    <section class="shop container">
         <!-- Carrossel -->
        <div class="container-slider">
            <button id="prev-button"><img src="IMG/arrow.png" alt="prev-button"></button>
            <div class="container-images">
              <img src="IMG/Kit_1.jpg" alt="girl" class="slider on">
              <img src="IMG/Top.jpg" alt="girl" class="slider">
            </div>
            <button id="next-button"><img src="IMG/arrow.png" alt="next-button"></button>
          </div>

        <h2 class="title">Shop products</h2>
       
        <!-- Content -->
        <div class="shop-content">
            <!-- Box 1 -->
            <div class="product-box">
                <img src="IMG/Jogo_3.jpeg" alt="" class="product-img">
                <h2 class="product-title">Call of Dut</h2>
                <span class="price">$160,00</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!-- Box 2 -->
            <div class="product-box">
                <img src="IMG/Jogo_2.jpg" alt="" class="product-img">
                <h2 class="product-title">Fortnite</h2>
                <span class="price">$00,00</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!-- Box 3 -->
            <div class="product-box">
                <img src="IMG/Jogo_1.jpg" alt="" class="product-img">
                <h2 class="product-title">Minecraft</h2>
                <span class="price">$190,00</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!-- Box 4 -->
            <div class="product-box">
                <img src="IMG/Aces_3.jpeg" alt="" class="product-img">
                <h2 class="product-title">Controle DualSence</h2>
                <span class="price">$180,00</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!-- Box 5 -->
            <div class="product-box">
                <img src="IMG/Aces_2.jpeg" alt="" class="product-img">
                <h2 class="product-title">Kit Gamer</h2>
                <span class="price">$560,00</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
            <!-- Box 6 -->
            <div class="product-box">
                <img src="IMG/Aces_1.jpeg" alt="" class="product-img">
                <h2 class="product-title">Mouse</h2>
                <span class="price">$60,00</span>
                <i class='bx bx-shopping-bag add-cart'></i>
            </div>
        </div>
    </section>
    <!-- JS -->
    <script src="Access/JS/script.js"></script>

</body>

</html>
